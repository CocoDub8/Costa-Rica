name: Photos

# Copie dans le dépôt (dossier img) les photos Wikimedia Commons utilisées par le site.
# Se lance tout seul quand index.html change, ou à la main : onglet Actions > Photos > Run workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - index.html

permissions:
  contents: write
  pages: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les photos depuis Wikimedia Commons
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          html = open("index.html", encoding="utf-8").read()
          m = re.search(r'<script type="application/json" id="photo-list">(.*?)</script>', html, re.S)
          items = json.loads(m.group(1)) if m else []
          os.makedirs("img", exist_ok=True)
          ua = "CostaRicaFamille/1.0 (site familial ; https://github.com/%s)" % os.environ.get("GITHUB_REPOSITORY", "")
          ok, bad = [], []
          for slug, path in items:
              dest = os.path.join("img", slug)
              if os.path.exists(dest) and os.path.getsize(dest) > 1000:
                  ok.append(slug)
                  continue
              url = "https://commons.wikimedia.org/wiki/Special:FilePath/" + urllib.parse.quote(path, safe="%/?=&(),_-.'!~*:")
              err = ""
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": ua})
                      with urllib.request.urlopen(req, timeout=90) as r:
                          data, ctype = r.read(), r.headers.get("Content-Type", "")
                      if not ctype.startswith("image/") or len(data) < 1000:
                          raise ValueError("réponse inattendue : " + ctype)
                      open(dest, "wb").write(data)
                      ok.append(slug)
                      break
                  except Exception as e:
                      err = str(e)
                      time.sleep(4 * (attempt + 1))
              else:
                  bad.append((path, err))
              time.sleep(0.7)
          json.dump(sorted(ok), open(os.path.join("img", "ok.json"), "w"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("### Photos : %d en place, %d introuvables\n" % (len(ok), len(bad)))
              for p, e in bad:
                  s.write("- %s : %s\n" % (p, e))
          print(len(ok), "photos en place,", len(bad), "introuvables")
          PY

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "photos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Photos copiées depuis Wikimedia Commons"
          git push

      - name: Republier le site
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
